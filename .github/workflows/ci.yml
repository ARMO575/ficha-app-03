name: CI/CD Ficha App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  IMAGEN: arecmon605/ficha-app-03

jobs:
  comprobar:
    name: Comprobar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Comprobar que compila
        run: python -m py_compile ficha_app.py

      - name: Comprobar PEP 8
        run: |
          python -m pip install pycodestyle
          python -m pycodestyle ficha_app.py

      - name: Ejecutar las diez opciones
        run: python ficha_app.py

  publicar:
    name: Publicar
    needs: comprobar
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar emulacion QEMU para arm64
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: arecmon605
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar para amd64 y arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.IMAGEN }}:$VERSION -t ${{ env.IMAGEN }}:latest --push .
